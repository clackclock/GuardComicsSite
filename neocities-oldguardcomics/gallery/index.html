<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGC - Gallery</title>
    <link rel="icon" type="image/svg+xml" href="../images/guardLogo.png" />
    
    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquarda+Bastarda+9&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Sankofa+Display&display=swap" rel="stylesheet">
    
    <!-- style -->
    <link href="../style.css" rel="stylesheet" type="text/css" media="all">
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    
    <!-- scripts -->
    <script src="script.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  </head>
  <body>
    <header>
      <div class="leftSide">
        <img class="logo" src="../images/guardLogo.png" height="150px">
        <div id="titleText">OLD GUARD COMICS</div>
      </div>
      <div class="header-menu">
        <a href="/gallery" aria-label="Gallery/Uploads" class="button-57" role="button"><span class="text">Artisans' Alley</span><span>Gallery/Uploads</span></a>
        <a href="/contact" aria-label="Contacts + Info" class="button-57" role="button"><span class="text">King's Office</span><span>Contacts + Info </span></a>
        <a href="/" aria-label="Home" class="button-57" role="button"><span class="text">Gatehouse</span><span>Home</span></a>
      </div>
    </header>
    <div class="tab" style="display: flex; flex-direction: row; border-radius:0rem; box-shadow:inherit;">
      <button class="tablinks" onclick="showContent(event, 'Concepts')">Concept Art / W.I.P</button>
      <button class="tablinks" onclick="showContent(event, 'Comics')">Comics</button>
      <!-- <button class="tablinks" onclick="showContent(event, 'Gallery')">Full Gallery</button> -->
    </div>
    <main>
      <div id="Concepts" class="gallery-container tabcontent"> </div>
      <div id="Comics" class="gallery-container tabcontent"> </div>
      <!-- <div id="Gallery" class="gallery-container tabcontent">
        Gallery items will be dynamically inserted here
      </div> -->
    </main>

    <!-- The Modal/Lightbox = OPERATION NO GRABBY GRABBY -->
    <div id="fileModal" class="modal" onclick="closeModal(event)">
      <div class="modal-content-wrapper">
        <span class="close-btn" onclick="closeModal(event)">&times;</span>
        <!-- JavaScript -->
        <div id="modalContent"></div>
      </div>
    </div>
  </body>
</html>
