<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGC - Gallery</title>
    <link rel="icon" type="image/svg+xml" href="../images/Chess_knight.png" />
    
    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jacquarda+Bastarda+9&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Sankofa+Display&display=swap" rel="stylesheet">
    
    <link href="../style.css" rel="stylesheet" type="text/css" media="all">
    <link href="style.css" rel="stylesheet" type="text/css" media="all">
    
    <style>
      /* --- Gallery Container Styles --- */
      .gallery-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
        max-height: 60vh;
        overflow-y: auto;
        
        /* Hide scrollbar for Chrome, Safari and Opera */
        -ms-overflow-style: none;
        /* IE and Edge */
        scrollbar-width: none;
        /* Firefox */
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .gallery-container::-webkit-scrollbar {
        display: none;
      }

      .gallery-item {
        flex: 0 0 calc(20% - 10px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        border: 1px solid #ccc;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transition: transform 0.2s, box-shadow 0.2s;
        background-color: #fff;
        cursor: pointer;
        
        min-width:fit-content;
        /* Indicate item is clickable */
      }

      .gallery-item:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      }

      .gallery-item img,
      .gallery-item embed {
        width: 100%;
        height: 200px;
        /* Uniform height for all items */
        object-fit: cover;
        /* Cover the container without distortion */
        pointer-events: none;
        /* Prevents dragging/opening in new tab on img element */
      }

      .gallery-item .title {
        padding: 10px;
        font-family: "Sankofa Display", sans-serif;
        font-size: 1rem;
        color: #333;
        font-weight: bold;
      }

      /* --- Modal (Lightbox) Styles --- */
      .modal {
        display: none;
        /* Hidden by default */
        position: fixed;
        /* Stay in place */
        z-index: 100;
        /* Sit on top */
        left: 0;
        top: 0;
        width: 100%;
        /* Full width */
        height: 100%;
        /* Full height */
        overflow: auto;
        /* Enable scroll if needed */
        background-color: rgba(0, 0, 0, 0.9);
        /* Black w/ opacity */
        animation: fadeIn 0.3s;
      }
      .modal-content-wrapper {
        position: relative;
        margin: 5% auto;
        /* 5% from the top and centered */
        padding: 0;
        width: 90%;
        /* Width of the content box */
        max-width: 800px;
        text-align: center;
      }
      .modal-content-wrapper img,
      .modal-content-wrapper embed {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: 80vh;
        /* Set a maximum height relative to the viewport */
        margin: 0 auto;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }

      /* The Close Button */
      .close-btn {
        position: absolute;
        top: -30px;
        /* Position above the content */
        right: 0px;
        color: #f1f1f1;
        font-size: 40px;
        font-weight: bold;
        transition: 0.3s;
        cursor: pointer;
      }
      .close-btn:hover,
      .close-btn:focus {
        color: #bbb;
        text-decoration: none;
        cursor: pointer;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      /* --- Responsive Gallery Styles --- */
      @media (max-width: 1024px) {
        .gallery-item {
          flex: 0 0 calc(25% - 10px);
        }
      }
      @media (max-width: 768px) {
        .gallery-item {
          flex: 0 0 calc(33.33% - 10px);
        }

        .modal-content-wrapper {
          margin-top: 10%;
        }
      }
      @media (max-width: 480px) {
        .gallery-item {
          flex: 0 0 calc(50% - 10px);
        }

        .close-btn {
          top: -35px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="leftSide">
        <img class="logo" src="../images/guardLogo.png" height="150px">
        <div id="titleText">OLD GUARD COMICS</div>
      </div>
      <div class="header-menu">
        <a href="/gallery">
          <button class="button-57" role="button">
            <span class="text">Artisans' Alley</span>
            <span>Gallery/Uploads</span>
          </button>
        </a>
        <a href="/contact">
          <button class="button-57" role="button">
            <span class="text">King's Office</span>
            <span>Contacts + Info </span>
          </button>
        </a>
        <a href="/">
          <button class="button-57" role="button">
            <span class="text">Gates</span>
            <span>Home</span>
          </button>
        </a>
      </div>
    </header>
    <div class="tab" style="display: flex; flex-direction: row; border-radius:0rem; box-shadow:inherit;">
      <button class="tablinks" onclick="showContent(event, 'Concepts')">Concept Art</button>
      <button class="tablinks" onclick="showContent(event, 'Comics')">Comics</button>
      <button class="tablinks" onclick="showContent(event, 'Gallery')">Full Gallery</button>
    </div>
    <main>
      <div id="Concepts" class="gallery-container tabcontent">
      
      </div>
      <div id="Comics" class="gallery-container tabcontent">
      
      </div>
      <div id="Gallery" class="gallery-container tabcontent">
        <!-- Gallery items will be dynamically inserted here -->
      </div>
    </main>

    <!-- The Modal/Lightbox = OPERATION NO GRABBY GRABBY -->
    <div id="fileModal" class="modal" onclick="closeModal(event)">
      <div class="modal-content-wrapper">
        <span class="close-btn" onclick="closeModal(event)">&times;</span>
        <!-- JavaScript -->
        <div id="modalContent"></div>
      </div>
    </div>
    <script>
    // tab button scripts
      function showContent(evt, cityName) {
        // Declare all variables
        var i, tabcontent, tablinks;
      
        // Get all elements with class="tabcontent" and hide them
        tabcontent = document.getElementsByClassName("tabcontent");
        for (i = 0; i < tabcontent.length; i++) {
          tabcontent[i].style.display = "none";
        }
      
        // Get all elements with class="tablinks" and remove the class "active"
        tablinks = document.getElementsByClassName("tablinks");
        for (i = 0; i < tablinks.length; i++) {
          tablinks[i].className = tablinks[i].className.replace(" active", "");
        }
      
        // Show the current tab, and add an "active" class to the button that opened the tab
        document.getElementById(cityName).style.display = "flex";
        evt.currentTarget.className += " active";
      }
      
      
      function getProcessedUrl(url) {
        // If the URL is external (like discord CDN), use it directly
        if (url.startsWith('http://') || url.startsWith('https://')) {
          return url;
        }
        return url;
      }

      function openModal(url, type) {
        const modal = document.getElementById('fileModal');
        const content = document.getElementById('modalContent');

        // Clear previous content
        content.innerHTML = '';

        // Create the element to display the content
        let mediaElement;

        // Disables right-click context menu (not foolproof, but a deterrent)
        // const contextMenuProtection = 'oncontextmenu="return false;"'; 

        if (type === 'image') {
          mediaElement = document.createElement('img');
          mediaElement.src = getProcessedUrl(url);
          mediaElement.alt = 'Gallery Item';
          mediaElement.setAttribute('style', 'pointer-events: none;'); // Stronger protection against drag/save
          mediaElement.setAttribute('oncontextmenu', 'return false;');
        } else if (type === 'pdf') {
          // Note: PDFs are inherently easier to download/print. Embedding provides a view.
          mediaElement = document.createElement('embed');
          mediaElement.src = getProcessedUrl(url);
          mediaElement.type = 'application/pdf';
          mediaElement.setAttribute('style', 'width: 100%; height: 80vh;');
        }

        if (mediaElement) {
          content.appendChild(mediaElement);
          modal.style.display = 'block';
        }
      }

      function closeModal(event) {
        // Only close if the close button or the dark background is clicked
        if (event.target.classList.contains('close-btn') || event.target.id === 'fileModal') {
          document.getElementById('fileModal').style.display = 'none';
        }
      }
      
      // Function to set the initial active tab
      function initializeTabs() {
        // Default to 'Gallery'
        const defaultTab = 'Gallery';
        const defaultButton = document.querySelector(`.tab button[onclick*="'${defaultTab}'"]`);
        
        if (defaultButton) {
          // Manually trigger the tab display for the default tab
          // Passing an object that mimics the required event structure
          showContent({ currentTarget: defaultButton }, defaultTab);
        }
      }
      
      document.addEventListener('DOMContentLoaded', () => {
        const galleryContainerConcepts = document.getElementById('Concepts');

        // Define the array of files to display
        const filesConcepts = [
          { name: 'SMH - OLD Concept Sheet', type: 'image', url: '/_archive/smbuOriginalCS.jpg' },
          { name: 'SMH - NEW SB Concept', type: 'image', url: '/_archive/smoke_bubble_characterSheet.jpg' },
          { name: 'SMH - NEW Trish Concept', type: 'image', url: '/_archive/trishca_concept.jpg' },
          { name: 'D.tv @sockpot21 Collab - Adam Concept 1', type: 'image', url: '/_archive/adam.png' },
          { name: 'D.tv @sockpot21 Collab - Adam Concept 2', type: 'image', url: '/_archive/Edited_Adam_comm.png' },
          { name: 'D.tv @sockpot21 Collab - Concept Sketch', type: 'image', url: '/_archive/Detox_V1_comm.png' },
          { name: 'D.tv @sockpot21 Collab - Concept Sketch 2', type: 'image', url: '/_archive/Detox_V2_comm.png' },
          { name: 'D.tv @sockpot21 Collab - Concept Skecth 3', type: 'image', url: '/_archive/Detox_V3_comm.png' },
          { name: 'SMH - Royal Accountant Concept', type: 'image', url: '/_archive/advisorDesign.jpg' }
        ];

        filesConcepts.forEach(file => {
          const galleryItem = createGalleryItem(file);
          galleryContainerConcepts.appendChild(galleryItem);
        });
        
        // Comics tab generation
        const galleryContainerComics = document.getElementById('Comics');
        const filesComics = [
          { name: 'SMH - Power Concept Comic', type: 'image', url: '/_archive/Power_Concept.jpg' },
          { name: 'SMH - Fantasy Pork Tongue', type: 'image', url: '/_archive/porkTongueDish.jpg' }
        ];

        filesComics.forEach(file => {
          const galleryItem = createGalleryItem(file);
          galleryContainerComics.appendChild(galleryItem);
        });

        // Full Gallery tab generation
        const galleryContainerGallery = document.getElementById('Gallery');
        const filesGallery = [
          { name: 'SMH - Power Concept Comic', type: 'image', url: '/_archive/Power_Concept.jpg' },
          { name: 'SMH - OLD Concept Sheet', type: 'image', url: '/_archive/smbuOriginalCS.jpg' },
          { name: 'SMH - NEW SB Concept', type: 'image', url: '/_archive/smoke_bubble_characterSheet.jpg' },
          { name: 'SMH - NEW Trish Concept', type: 'image', url: '/_archive/trishca_concept.jpg' },
          { name: 'SMH - IncorrectQuotes1 Sketch', type: 'image', url: '/_archive/incorrectQuotessketch.jpg' },
          { name: 'D.tv @sockpot21 Collab - Adam Concept 1', type: 'image', url: '/_archive/adam.png' },
          { name: 'D.tv @sockpot21 Collab - Adam Concept 2', type: 'image', url: '/_archive/Edited_Adam_comm.png' },
          { name: 'D.tv @sockpot21 Collab - Concept Sketch', type: 'image', url: '/_archive/Detox_V1_comm.png' },
          { name: 'D.tv @sockpot21 Collab - Concept Sketch 2', type: 'image', url: '/_archive/Detox_V2_comm.png' },
          { name: 'D.tv @sockpot21 Collab - Concept Skecth 3', type: 'image', url: '/_archive/Detox_V3_comm.png' },
          { name: 'SMH - Royal Accountant Concept', type: 'image', url: '/_archive/advisorDesign.jpg' },
          { name: 'SMH - Fantasy Pork Tongue', type: 'image', url: '/_archive/porkTongueDish.jpg' }
        ];

        filesGallery.forEach(file => {
          const galleryItem = createGalleryItem(file);
          galleryContainerGallery.appendChild(galleryItem);
        });
        
        // Helper function to create a gallery item (to avoid repeating code)
        function createGalleryItem(file) {
            const galleryItem = document.createElement('div');
            galleryItem.classList.add('gallery-item');

            let mediaElement;
            if (file.type === 'image') {
              mediaElement = document.createElement('img');
              mediaElement.src = file.url;
              mediaElement.alt = file.name;
              // Ensure preview image is also protected from basic dragging/saving
              mediaElement.setAttribute('style', 'pointer-events: none;');
            } else if (file.type === 'pdf') {
              mediaElement = document.createElement('embed');
              mediaElement.src = file.url;
              mediaElement.type = 'application/pdf';
            }

            const titleElement = document.createElement('div');
            titleElement.classList.add('title');
            titleElement.textContent = file.name;

            // The entire item is now clickable, replacing the link wrapping
            galleryItem.addEventListener('click', () => {
              openModal(file.url, file.type);
            });

            galleryItem.appendChild(mediaElement);
            galleryItem.appendChild(titleElement);
            return galleryItem;
        }

        // Add keyboard support to close modal with ESC key (kept separate for clarity)
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && document.getElementById('fileModal').style.display === 'block') {
            closeModal({
              target: document.getElementById('fileModal')
            });
          }
        });
        
        // Finally, initialize the tabs to show the default one
        initializeTabs();
      });
    </script>
  </body>
</html>
