<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Library</title>
    <link rel="icon" type="image/svg+xml" href="../images/guardLogo.png" />
    <link rel="stylesheet" href="readerStyle.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="readerScript.js" defer></script>
</head>
<body oncontextmenu="return false;">
    <div class="reader-container">
        <button id="mobile-menu-toggle" onclick="toggleMobileMenu()">📜 Menu</button>
        <nav class="chapter-sidebar">
            <div id="library-header">
                <h2 id="current-view-title">The Grand Library</h2>
                <div class="search-container">
                    <input type="text" id="sidebar-search" placeholder="Search archives..." onkeyup="handleSearch()">
                </div>
                <div class="action-buttons">
                    <button id="add-favorite-btn" onclick="saveCurrentPageToFavorites()">⭐ Bookmark</button>
                    <button id="share-page-btn" onclick="generateShareLink()">🔗 Share Page</button>
                </div>
                <button id="back-to-library" class="hidden" onclick="showLibrary()">← Back to Library</button>
                <button id="back-to-gallery" onclick="window.location.href='/gallery'">← Back to Gallery</button>
                <button id="zoom-toggle-btn" onclick="toggleViewMode()">🔍 Zoom In</button>
            </div>

            <div id="favorites-section">
                <h3>Your Bookmarks</h3>
                <ul id="favorites-list"></ul>
            </div>

            <hr style="border: 1px solid #333; margin: 15px 0;">

            <ul id="sidebar-list"></ul>
        </nav>

        <main id="pdf-view-parent">
            <div id="pdf-viewer-container" > <!-- style="position: relative;"-->
                <div id="reader-placeholder">
                    <div class="placeholder-content">
                        <span class="placeholder-icon">📜</span>
                        <h3>Select a Book from the Library</h3>
                        <p>Choose an issue from the sidebar to begin your journey.</p>
                    </div>
                </div>

                <div id="loading-spinner" class="spinner-hidden">
                    <div class="loader"></div>
                    <p>Unrolling Scroll...</p>
                </div>
                
                <canvas id="pdf-render-canvas"></canvas>
            </div>
        </main>
    </div>
</body>
</html>
